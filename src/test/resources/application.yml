spring:
  datasource:
    url: jdbc:h2:mem:garment_store_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  security:
    jwt:
      issuer: garment-store-backend-test
      access-token-expiry-minutes: 15
      refresh-token-expiry-days: 30
      secret: test-secret-change-this-test-secret-change-this-test-secret
    otp:
      registration-expiry-minutes: 10
      max-attempts: 5
      expose-dev-otp: true
    password-reset:
      token-expiry-minutes: 15
      expose-dev-token: true
    guest-session:
      expiry-days: 30
    admin:
      lockout-threshold: 5
      bootstrap-enabled: true
      bootstrap-email: admin@garmentstore.local
      bootstrap-mobile: 9999999999
      bootstrap-name: Store Admin
      bootstrap-password: Admin@12345
