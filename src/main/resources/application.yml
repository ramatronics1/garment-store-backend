spring:
  application:
    name: garment-store-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  # ── Email (Gmail SMTP via JavaMail) ────────────────────────────────────────
  # Create a Gmail App Password: Google Account → Security → 2-Step Verification → App passwords
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_ADDRESS:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    test-connection: false   # Don't fail startup if mail is not configured in dev
  # ── Async thread pool (for @Async notification sends) ─────────────────────
  task:
    execution:
      pool:
        core-size: 4
        max-size: 10
        queue-capacity: 100
      thread-name-prefix: notif-async-
server:
  port: ${SERVER_PORT:8080}
app:
  security:
    jwt:
      issuer: garment-store-backend
      access-token-expiry-minutes: 15
      refresh-token-expiry-days: 30
      secret: ${JWT_SECRET:change-this-local-development-secret-change-this-local-development-secret}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    otp:
      registration-expiry-minutes: ${OTP_REGISTRATION_EXPIRY_MINUTES:10}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
      expose-dev-otp: ${OTP_EXPOSE_DEV_OTP:true}
    guest-session:
      expiry-days: ${GUEST_SESSION_EXPIRY_DAYS:30}
    admin:
      lockout-threshold: ${ADMIN_LOCKOUT_THRESHOLD:5}
      bootstrap-enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:admin@garmentstore.local}
      bootstrap-mobile: ${ADMIN_BOOTSTRAP_MOBILE:9999999999}
      bootstrap-name: ${ADMIN_BOOTSTRAP_NAME:Store Admin}
      bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:Admin@12345}
  cloudinary:
    # Format: cloudinary://api_key:api_secret@cloud_name
    # Sign up free at https://cloudinary.com — 25 GB storage + CDN included
    url: ${CLOUDINARY_URL:}
    folder: ${CLOUDINARY_FOLDER:vastra/products}
    enabled: ${CLOUDINARY_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ── Notification Module ────────────────────────────────────────────────────────
notification:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
  whatsapp:
    enabled: ${NOTIFICATION_WHATSAPP_ENABLED:false}
  low-stock-threshold: ${LOW_STOCK_THRESHOLD:5}
  admin:
    email: ${ADMIN_NOTIFICATION_EMAIL:admin@vastra.in}
    whatsapp: ${ADMIN_NOTIFICATION_WHATSAPP:}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
